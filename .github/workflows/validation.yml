name: Backend Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Runner check
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -e
          find . -type f -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -print0 |
          while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Load critical models
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        run: |
          node -e "for (const f of ['./models/Ad','./models/Category','./models/User','./models/Package']) { require(f); console.log('Loaded', f) }"

      - name: MongoDB connection smoke test
        if: ${{ secrets.MONGO_URI != '' }}
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          node - <<'NODE'
          const mongoose = require('mongoose');
          (async () => {
            await mongoose.connect(process.env.MONGO_URI, { serverSelectionTimeoutMS: 10000 });
            console.log('MongoDB connection successful');
            console.log('Database:', mongoose.connection.name);
            await mongoose.connection.db.admin().ping();
            console.log('MongoDB ping successful');
            await mongoose.disconnect();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
      - name: API health smoke test
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
          PORT: 5000
        run: |
          node index.js > /tmp/currentbackend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/ > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/currentbackend.log
          exit 1
